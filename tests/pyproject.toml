[project]
name = "serve"
version = "0.2.0"
description = "Integration test suite for serve (Go binary)"
readme = "README.md"
authors = [
    { name = "ericbryant24", email = "ericbryant24@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-playwright>=0.7.2",
    "websockets>=16.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["."]
